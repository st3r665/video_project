server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/tide;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

# 推荐服务（Python）地址与媒体文件地址
rec:
  service-url: http://localhost:8000
  media-url: http://localhost:8000
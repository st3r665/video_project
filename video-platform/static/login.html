<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 潮汐视频</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page">
  <div class="card">
    <h1>🌊 潮汐视频</h1>
    <div class="sub">登录后开启专属推荐 · 越刷越懂你</div>
    <div class="tabs">
      <button id="tabLogin" class="on">登录</button>
      <button id="tabReg">注册</button>
    </div>
    <div class="field">
      <label>用户名</label>
      <input id="username" maxlength="20" placeholder="demo" autocomplete="username">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="password" type="password" maxlength="40" placeholder="至少 6 位" autocomplete="current-password">
    </div>
    <button class="submit" id="submitBtn">登 录</button>
    <div class="msg" id="msg"></div>
    <div class="hint">演示账号：demo / demo123</div>
    <div class="hint"><a href="/">← 先随便逛逛</a></div>
  </div>
</div>
<script src="/static/app.js"></script>
<script>
(function () {
  let mode = 'login';
  const tabLogin = document.getElementById('tabLogin');
  const tabReg = document.getElementById('tabReg');
  const submitBtn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');

  function setMode(m) {
    mode = m;
    tabLogin.classList.toggle('on', m === 'login');
    tabReg.classList.toggle('on', m === 'reg');
    submitBtn.textContent = m === 'login' ? '登 录' : '注 册';
    msg.textContent = '';
  }
  tabLogin.onclick = () => setMode('login');
  tabReg.onclick = () => setMode('reg');

  async function submit() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    msg.className = 'msg';
    msg.textContent = '请稍候…';
    try {
      const data = mode === 'login'
        ? await API.post('/api/login', { username, password })
        : await API.post('/api/register', { username, password });
      localStorage.setItem('tide_token', data.token);
      API.token = data.token;
      msg.className = 'msg ok';
      msg.textContent = mode === 'login' ? '登录成功，正在进入…' : '注册成功，正在进入…';
      setTimeout(() => location.href = '/', 600);
    } catch (e) {
      msg.className = 'msg err';
      msg.textContent = e.message;
    }
  }
  submitBtn.onclick = submit;
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') submit();
  });
})();
</script>
</body>
</html>
